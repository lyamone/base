name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:ui

      - name: Generate npm OTP
        id: otp
        run: |
          CODE=$(node scripts/generate-npm-otp.mjs)
          echo "::add-mask::$CODE"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
        env:
          NPM_OTP_SECRET: ${{ secrets.NPM_OTP_SECRET }}

      - name: Publish to npm
        run: npm publish --access public --otp="${{ steps.otp.outputs.code }}"
        working-directory: dist/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
