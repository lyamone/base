<div
  class="ul-radial"
  role="progressbar"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-valuenow]="percentage()"
  aria-valuemin="0"
  aria-valuemax="100"
  [class.ul-radial--infinite]="infinite()"
  [style.width.px]="size()"
  [style.padding.px]="lineWidth()"
  [style.--ul-radial-percentage]="percentage() + '%'"
></div>
