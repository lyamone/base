<div class="ul-dropdown">
  <ul-menu-trigger
    [theme]="theme()"
    [disabled]="disabled()"
    [iconOnly]="triggerIconOnly()"
    [iconOnlyLabel]="iconOnlyLabel()"
    [label]="selectedItem().label"
    [leftIcons]="selectedItem().leftIcons ?? []"
    [rightIcons]="triggerRightIcons()"
    [menuTemplate]="menu"
    [menuId]="menuId"
    [isOpen]="isOpen()"
    (opened)="onMenuOpened()"
    (closed)="onMenuClosed()"
  />

  <ng-template #menu>
    <div class="ul-dropdown__backdrop" (click)="closeMenu()"></div>
    <div cdkMenu class="ul-dropdown__content ul-scrollable" [id]="menuId">
      <ul-menu-items
        [items]="items()"
        [theme]="theme()"
        [selectedIndex]="selectedIndex()"
        (itemTriggered)="handleItemTriggered($event)"
      />
    </div>
  </ng-template>
</div>
